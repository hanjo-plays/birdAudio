[project]
name = "birdaudio"
version = "0.1.0"
description = "Bird call audio dataset download, preprocessing, and classification"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "requests",
    "python-dotenv",
    "librosa",
    "soundfile",
    "scikit-learn",
    "torch",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
notebooks = [
    "jupyter",
    "matplotlib",
]

# Get CUDA-enabled PyTorch (PyPI's Windows torch wheels are CPU-only).
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
